<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/beercss@3.4.11/dist/cdn/beer.min.css" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.4.11/dist/cdn/beer.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/material-icons/iconfont/material-icons.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
    }

    .sidebar {
      position: fixed;
      top: 64px; /* height of top bar */
      left: 0;
      width: 60px;
      height: calc(100vh - 64px);
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1rem;
      gap: 1rem;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
    }

    .content {
      margin-top: 64px; /* top bar height */
      margin-left: 60px; /* sidebar width */
      padding: 1rem;
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }

    @media (max-width: 600px) {
      .sidebar {
        flex-direction: row;
        height: auto;
        width: 100%;
        top: 64px;
        left: 0;
        right: 0;
        padding: 0.5rem;
        justify-content: space-around;
      }

      .content {
        margin-left: 0;
        margin-top: 128px; /* top bar + sidebar on mobile */
      }
    }
    .top-bar .title {
        font-size: 1.8rem;
        font-weight: 600;
    }
  </style>
</head>
<body class="dark">

    <!-- Top Bar -->
    <header class="bar top background surface top-bar">
      <div class="max row middle-align space-between">

        <!-- Left buttons (optional placeholder) -->
        <div class="row gap">
          <!-- You can add more icons here later if needed -->
        </div>

        <!-- Center title -->
        <div class="center-align grow">
          <span class="title">Advanced Spotify Analyzer</span>
        </div>

        <!-- Right buttons -->
        <div class="row gap">
          <a href="friends"><button class="circle transparent" aria-label="Friends"><i class="material-icons">group</i></button></a>
          <a href="settings"><button class="circle transparent" aria-label="Settings"><i class="material-icons">settings</i></button></a>
          <a><button id="logout" class="circle transparent" aria-label="Logout"><i class="material-icons">logout</i></button></a>
        </div>
      </div>
    </header>


  <!-- Sidebar -->
  <nav class="sidebar surface">
    <button class="circle transparent"><i class="material-icons">home</i></button>
  </nav>

  <!-- Main Content -->
  <main class="content">
    <div class="card">
      <header class="padding strong">Top Creators</header>
      <div class="padding">Data here</div>
      <footer class="padding row middle-align space-between text-small">
          <button id="prev-top-creators" class="circle transparent">
          <i class="material-icons">chevron_left</i>
          </button>

          <span id="page-top-creators">Page: 1</span>

          <button id="next-top-creators" class="circle transparent">
          <i class="material-icons">chevron_right</i>
          </button>
      </footer>
    </div>

    <div class="card">
      <header class="padding strong">Top Tracks</header>
      <div class="padding">Data here</div>
      <footer class="padding row middle-align space-between text-small">
          <button id="prev-top-tracks" class="circle transparent">
          <i class="material-icons">chevron_left</i>
          </button>

          <span id="page-top-tracks">Page: 1</span>

          <button id="next-top-tracks" class="circle transparent">
          <i class="material-icons">chevron_right</i>
          </button>
      </footer>

    </div>

    <div class="card">
      <header class="padding strong">Top Albums</header>
      <div class="padding">Data here</div>
      <footer class="padding row middle-align space-between text-small">
          <button id="prev-top-albums" class="circle transparent">
          <i class="material-icons">chevron_left</i>
          </button>

          <span id="page-top-albums">Page: 1</span>

          <button id="next-top-albums" class="circle transparent">
          <i class="material-icons">chevron_right</i>
          </button>
      </footer>
    </div>

    <div class="card">
      <header class="padding strong">Top Genres</header>
      <div class="padding">Data here</div>
      <footer class="padding row middle-align space-between text-small">
          <button id="prev-top-genres" class="circle transparent">
          <i class="material-icons">chevron_left</i>
          </button>

          <span id="page-top-genres">Page: 1</span>

          <button id="next-top-genres" class="circle transparent">
          <i class="material-icons">chevron_right</i>
          </button>
      </footer>
    </div>
  </main>
  <script>
    // URL constants
    const baseUrl = "{{ url_for('index') }}".slice(0, -6)
    const logoutUrl = "{{ url_for('logout') }}";
    const loginUrl = "{{ url_for('login') }}";
  </script>
  <script src="../static/js/logout.js"></script>
</body>
</html>
